[project]
name = "technical-suzaki"
version = "0.1.0"
description = ""
authors = [
    {name = "Zakihran13",email = "zakisuzaki13@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13, <3.15"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "aiometer (>=1.0.0,<2.0.0)",
    "nest-asyncio (>=1.6.0,<2.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "apache-airflow[cncf-kubernetes] (>=3.3.1,<4.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "inflection (>=0.5.1,<0.6.0)"
]

[tool.poetry]
packages = [{include = "projects"}, {include = "data"}, {include = "dags"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
