version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: music_catalog_mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: "music_catalog"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:16-alpine
    container_name: music_catalog_postgresql
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: "music_user"
      POSTGRES_PASSWORD: "music_password"
      POSTGRES_DB: "massive_music"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_user -d massive_music"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  postgresql_data: