version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack_kinesis
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"   # External service port range
    environment:
      - SERVICES=kinesis                  # Enable Kinesis (optional; defaults to all services)
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=1                     # Persist state across restarts
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./localstack_data:/var/lib/localstack"                   # Data persistence volume
      - "./init-scripts:/etc/localstack/init/ready.d"              # Auto-run init scripts on startup
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5